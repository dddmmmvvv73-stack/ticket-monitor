  if (S.view !== "settings") return;
  var t = ev.target.closest("[data-st],[data-sa]"); if (!t || t.disabled) return;
  var c = S.cfg;
  if (t.hasAttribute("data-st")) { S.setTab = t.getAttribute("data-st"); S.keyEdit = false; S.enter = true; rerender('[data-st="' + S.setTab + '"]'); return; }
  var a = t.getAttribute("data-sa"), v = t.getAttribute("data-sv"), same = '[data-sa="' + a + '"]' + (v != null ? '[data-sv="' + v + '"]' : '');
  if (a === "run") collectNow();
  else if (a === "interval") { c.interval = +v; rerender(same); }
  else if (a === "logf") { S.logFilter = v; rerender(same); }
  else if (a === "remove") {
    var s = c.sources[+v];
    if (!confirm("Убрать площадку «" + s.name + "»? Уже собранные мероприятия и их история сохранятся.")) return;
    c.sources.splice(+v, 1); rerender("#venueAdd"); toast("Площадка «" + s.name + "» убрана из сбора.");
  }
  else if (a === "add") {
    var id = $("venueAdd").value;
    if (!id) { $("venueAdd").focus(); toast("Выберите площадку в списке."); return; }
    var name = VK_VENUES.filter(function (x) { return x[0] === id; })[0][1];
    c.sources.push({ name: name, afisha: "vladimirkoncert.ru", venueId: id, on: true, n: null, removable: true });
    rerender("#venueAdd"); toast("«" + name + "» добавлена. Мероприятия появятся после следующего сбора.");
  }
  else if (a === "ya-freq") { S.yaFreq = v; rerender(same); }
  else if (a === "ya-remove") {
    var r = S.yaList[+v];
    if (!confirm("Перестать следить за «" + r.y.title + "»? Уже собранные данные сохранятся.")) return;
    S.yaList.splice(+v, 1); rerender("#yaUrl"); toast("«" + r.y.title + "» убрано из слежения.");
  }
  else if (a === "ya-add") {
    var url = $("yaUrl").value.trim(), m = /^https:\/\/afisha\.yandex\.ru\/([a-z-]+)\/[a-z_]+\/([a-z0-9-]+)/.exec(url);
    S.yaErr = m ? "" : "Нужна ссылка на страницу мероприятия: https://afisha.yandex.ru/город/раздел/название";
    if (m) S.yaList.push({ y: { id: m[2], title: m[2].replace(/-/g, " "), city: "", url: url, checks: 0 }, on: true, past: false });
    rerender("#yaUrl");
    if (m) toast("Ссылка добавлена. Название, площадку и дату приложение возьмёт со страницы при первой проверке.");
  }
  else if (a === "provider") { c.ai.provider = v; S.keyEdit = false; rerender(same); }
  else if (a === "key-edit") { S.keyEdit = true; rerender("#keyInput"); }
  else if (a === "key-cancel") { S.keyEdit = false; rerender('[data-sa="key-edit"]'); }
  else if (a === "key-save") {
    if (!$("keyInput").value.trim()) { $("keyInput").focus(); return; }
    c.ai[c.ai.provider === "gigachat" ? "gigaKey" : "claudeKey"] = true; S.keyEdit = false;
    rerender('[data-sa="key-edit"]'); toast("Ключ сохранён.");
  }
  else if (a === "key-del") {
    if (!confirm("Удалить ключ? Нейросеть перестанет доклассифицировать мероприятия, пока вы не вставите новый.")) return;
    c.ai[c.ai.provider === "gigachat" ? "gigaKey" : "claudeKey"] = false; rerender('[data-sa="key-edit"]');
  }
  else if (a === "test") toast("В прототипе проверка не выполняется. Последняя настоящая проверка — 29 сент., 18:54: подключение работает.");
  else if (a === "reclass") toast("В приложении нейросеть получит 32 мероприятия без жанра. В прототипе запрос не отправляется.");
  else if (a === "goto-nogenre") { S.view = "events"; S.tab = "nogenre"; S.enter = true; location.hash = "events"; render(); window.scrollTo(0, 0); }
  else if (a === "sheets-save") {
    var url = $("sheetsUrl").value.trim();
    S.sheetsErr = url && !/^https:\/\/script\.google\.com\/.+\/exec$/.test(url) ? "Нужна ссылка вида https://script.google.com/macros/s/…/exec" : "";
    if (!S.sheetsErr) { c.sheets.url = url; S.sheetsDraft = null; if (!url) c.sheets.auto = false; toast(url ? "Ссылка сохранена." : "Google Таблица отключена."); }
    rerender("#sheetsUrl");
  }
  else if (a === "sheets-now") toast("В прототипе выгрузка не выполняется.");
  else if (a === "copy") {
    var done = function () { toast("Код скопирован."); };
    try { navigator.clipboard.writeText(APPS_SCRIPT).then(done, function () { toast("Не удалось скопировать — выделите код и нажмите ⌘C."); }); }
    catch (e) { toast("Не удалось скопировать — выделите код и нажмите ⌘C."); }
  }
  else if (a === "csv") toast("В прототипе файл не скачивается. В приложении — все " + (c.csvPast ? "" : "будущие ") + "мероприятия, 32 столбца.");
});
$("view").addEventListener("change", function (ev) {
  var k = ev.target.getAttribute("data-sc"); if (!k) return;
  var c = S.cfg;
  if (k === "auto") c.auto = ev.target.checked;
  else if (k.indexOf("src:") === 0) c.sources[+k.slice(4)].on = ev.target.checked;
  else if (k.indexOf("ya:") === 0) S.yaList[+k.slice(3)].on = ev.target.checked;
  else if (k === "model") c.ai.model = ev.target.value;
  else if (k === "scope") c.ai.scope = ev.target.value;
  else if (k === "sheets-auto") c.sheets.auto = ev.target.checked;
  else if (k === "past") c.csvPast = ev.target.checked;
  else if (k === "interval-custom") { if (ev.target.value === "") return; c.interval = Math.max(5, Math.round(+ev.target.value) || 5); }
  rerender('[data-sc="' + k + '"]');
});
$("view").addEventListener("input", function (ev) { if (ev.target.id === "sheetsUrl") S.sheetsDraft = ev.target.value; });
// Раскрытые инструкции остаются раскрытыми после перерисовки
document.addEventListener("toggle", function (ev) { var d = ev.target; if (d.getAttribute && d.hasAttribute("data-how")) S.how[d.getAttribute("data-how")] = d.open; }, true);
$("runBtn").addEventListener("click", collectNow);
$("statusBtn").addEventListener("click", function () { S.view = "settings"; S.setTab = "collect"; S.enter = true; location.hash = "settings"; closeDrawer(); render(); window.scrollTo(0, 0); });

// ---------------------------------------------------------------- Календарь
function monthGrid(first) {
  var y = +first.slice(0, 4), m = +first.slice(5, 7);
  var d0 = new Date(Date.UTC(y, m - 1, 1)), shift = (d0.getUTCDay() + 6) % 7, last = +monthEnd(first).slice(8);
  var from = S.pickFrom, to = S.pickTo || S.pickFrom;
  var cells = ["пн", "вт", "ср", "чт", "пт", "сб", "вс"].map(function (w, k) { return '<div class="cal-wd' + (k >= 5 ? " wknd" : "") + '">' + w + '</div>'; }).join("");
  for (var k = 0; k < shift; k++) cells += '<button class="cal-day out" tabindex="-1" aria-hidden="true"></button>';
  for (var d = 1; d <= last; d++) {
    var iso = first.slice(0, 8) + (d < 10 ? "0" + d : d), wd = (shift + d - 1) % 7;
    var cls = "cal-day" + (wd >= 5 ? " wknd" : "") + (EVENT_DAYS[iso] ? " has" : "");
    if (from && iso >= from && iso <= to) cls += (iso === from || iso === to) ? " edge" : " in";
    cells += '<button class="' + cls + '" data-day="' + iso + '" aria-label="' + d + ' ' + MONTHS[m - 1] + (EVENT_DAYS[iso] ? ', есть мероприятия' : '') + '">' + d + '</button>';
  }
  return '<div><div class="cal-head"><span>' + MONTHS_FULL[m - 1][0].toUpperCase() + MONTHS_FULL[m - 1].slice(1) + ' ' + y + '</span></div><div class="cal-grid">' + cells + '</div></div>';
}
function shiftMonth(first, n) { var d = new Date(first + "T00:00:00Z"); d.setUTCMonth(d.getUTCMonth() + n); return d.toISOString().slice(0, 10); }
function renderCal() {
  var cal = $("cal");
  cal.hidden = !S.calOpen; $("dateBtn").setAttribute("aria-expanded", String(S.calOpen));
  if (!S.calOpen) return;
  var months = ["2026-09-01", "2026-10-01", "2026-11-01", "2026-12-01", "2027-01-01", "2027-02-01", "2027-03-01"];
  var right = shiftMonth(S.calMonth, 1);
  cal.innerHTML =
    '<div class="cal-months" role="group" aria-label="Быстрый выбор месяца">' + months.map(function (m) {
      var on = S.pickFrom === m && S.pickTo === monthEnd(m);
      return '<button data-month="' + m + '" aria-pressed="' + on + '">' + MONTHS_FULL[+m.slice(5, 7) - 1][0].toUpperCase() + MONTHS_FULL[+m.slice(5, 7) - 1].slice(1) + (m.slice(0, 4) !== "2026" ? " " + m.slice(0, 4) : "") + '</button>';
    }).join("") + '</div>' +
    '<div style="display:flex;justify-content:space-between;margin-bottom:-30px;position:relative;z-index:1">' +
      '<button class="cal-nav" data-calnav="-1" aria-label="Предыдущий месяц"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7.5 3l-3 3 3 3"/></svg></button>' +
      '<button class="cal-nav" data-calnav="1" aria-label="Следующий месяц"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4.5 3l3 3-3 3"/></svg></button></div>' +
    '<div class="cal-body" style="padding:0 40px">' + monthGrid(S.calMonth) + monthGrid(right) + '</div>' +
    '<div class="cal-foot"><span class="sel-text">' + (S.pickFrom ? (S.pickTo ? "Выбрано: " + rangeLabel(S.pickFrom, S.pickTo) : "Начало: " + human(S.pickFrom) + " — выберите конец") : "Нажмите на первый и последний день — в любом порядке. Точка — есть мероприятия.") + '</span>' +
      '<button class="btn-ghost" data-calact="reset">Сбросить</button><button class="btn-dark" data-calact="apply"' + (S.pickFrom ? "" : " disabled") + '>Показать</button></div>';
}
function openCal() {
  S.calOpen = true; S.pickFrom = S.period === "custom" ? S.from : null; S.pickTo = S.period === "custom" ? S.to : null;
  if (S.pickFrom) S.calMonth = S.pickFrom.slice(0, 8) + "01";
  renderCal();
}
$("cal").addEventListener("click", function (ev) {
  ev.stopPropagation();
  var t = ev.target.closest("button"); if (!t) return;
  if (t.hasAttribute("data-day")) {
    var d = t.getAttribute("data-day");
    if (!S.pickFrom || S.pickTo) { S.pickFrom = d; S.pickTo = null; }
    else if (d < S.pickFrom) { S.pickTo = S.pickFrom; S.pickFrom = d; }  // конец раньше начала — меняем местами
    else S.pickTo = d;
  } else if (t.hasAttribute("data-month")) { var m = t.getAttribute("data-month"); S.pickFrom = m; S.pickTo = monthEnd(m); S.calMonth = m; }
  else if (t.hasAttribute("data-calnav")) S.calMonth = shiftMonth(S.calMonth, +t.getAttribute("data-calnav"));
  else if (t.getAttribute("data-calact") === "reset") { S.pickFrom = S.pickTo = null; S.period = "all"; S.from = S.to = null; S.calOpen = false; render(); }
  else if (t.getAttribute("data-calact") === "apply" && S.pickFrom) { S.period = "custom"; S.from = S.pickFrom; S.to = S.pickTo || S.pickFrom; S.calOpen = false; render(); }
  renderCal();
});

// ---------------------------------------------------------------- Перетаскивание ширины столбцов
var drag = null;
document.addEventListener("mousedown", function (ev) {
  var h = ev.target.closest && ev.target.closest("[data-resize]");
  if (!h) return;
  ev.preventDefault(); ev.stopPropagation();
  var id = h.getAttribute("data-resize"), col = document.querySelector('col[data-col="' + id + '"]');
  drag = { id: id, x: ev.clientX, w: col.getBoundingClientRect().width || parseInt(col.style.width, 10), col: col, table: $("evTable"), handle: h };
  h.classList.add("active"); document.body.classList.add("resizing");
});
document.addEventListener("mousemove", function (ev) {
  if (!drag) return;
  var w = Math.max(64, Math.round(drag.w + ev.clientX - drag.x));
  drag.col.style.width = w + "px"; S.widths[drag.id] = w; drag.moved = true;
  var sum = 0; drag.table.querySelectorAll("col").forEach(function (col) { sum += parseFloat(col.style.width) || 0; });
  drag.table.style.width = sum + "px";
});
document.addEventListener("mouseup", function () {
  if (!drag) return;
  drag.handle.classList.remove("active"); document.body.classList.remove("resizing");
  var moved = drag.moved; drag = null; savePrefs();
  // Остальные столбцы подстраиваются под новую ширину. Простой клик не перерисовывает — иначе не сработает двойной клик «вернуть»
  if (moved) render();
});
document.addEventListener("dblclick", function (ev) {
  var h = ev.target.closest && ev.target.closest("[data-resize]");
  if (h) { delete S.widths[h.getAttribute("data-resize")]; savePrefs(); render(); }
});

// ---------------------------------------------------------------- Подсказки у заголовков
function showTip(el) {
  var r = el.getBoundingClientRect(), pop = $("infoPop");
  pop.textContent = el.getAttribute("data-tip"); pop.hidden = false;
  pop.style.left = Math.max(8, Math.min(window.innerWidth - 296, r.left - 130)) + "px"; pop.style.top = (r.bottom + 8) + "px";
}
document.addEventListener("mouseover", function (ev) { var t = ev.target.closest && ev.target.closest(".info"); if (t) showTip(t); });
document.addEventListener("mouseout", function (ev) { if (ev.target.closest && ev.target.closest(".info")) $("infoPop").hidden = true; });
document.addEventListener("focusin", function (ev) { if (ev.target.classList && ev.target.classList.contains("info")) showTip(ev.target); });
document.addEventListener("focusout", function (ev) { if (ev.target.classList && ev.target.classList.contains("info")) $("infoPop").hidden = true; });

// ---------------------------------------------------------------- рендер и события
function render() {
  document.querySelectorAll("[data-view]").forEach(function (b) { if (b.getAttribute("data-view") === S.view) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  if (["niches", "dynamics", "archive", "settings"].indexOf(S.view) >= 0) $("moreBtn").setAttribute("aria-current", "page"); else $("moreBtn").removeAttribute("aria-current");
  $("moreSheet").hidden = true; $("moreBtn").setAttribute("aria-expanded", "false");
  document.querySelectorAll("#period button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-p") === S.period)); });
  $("dateLabel").textContent = S.period === "custom" ? rangeLabel(S.from, S.to) : "Даты";
  $("dateBtn").style.borderColor = S.period === "custom" ? "var(--soot)" : "";
  $("view").innerHTML = S.view === "overview" ? renderOverview() : S.view === "niches" ? renderNiches() : S.view === "settings" ? renderSettings() : S.view === "sales" ? renderSales() : S.view === "venues" ? renderVenues() : S.view === "dynamics" ? renderDynamics() : S.view === "archive" ? renderArchive() : renderEvents();
  $("view").classList.toggle("enter", !!S.enter); S.enter = false; S.colsAnim = false;
  renderCal();
}

$("city").innerHTML = '<option>Все города</option>' + CITIES.map(function (c) { return '<option' + (c.name === S.city ? " selected" : "") + '>' + c.name + (c.ready ? "" : " — нет данных") + '</option>'; }).join("");
$("city").addEventListener("change", function () { S.city = this.value.replace(" — нет данных", ""); closeDrawer(); render(); });
$("period").addEventListener("click", function (ev) { var b = ev.target.closest("button"); if (b) { S.period = b.getAttribute("data-p"); S.from = S.to = null; render(); } });
$("dateBtn").addEventListener("click", function (ev) { ev.stopPropagation(); if (S.calOpen) { S.calOpen = false; renderCal(); } else openCal(); });
$("q").addEventListener("input", function () { S.q = this.value; if (S.view !== "events") S.view = "events"; render(); });
document.querySelectorAll("[data-view]").forEach(function (b) { b.addEventListener("click", function () { if (S.view !== b.getAttribute("data-view")) S.enter = true; S.view = b.getAttribute("data-view"); location.hash = S.view; render(); window.scrollTo(0, 0); }); });
$("veil").addEventListener("click", closeDrawer);
document.addEventListener("keydown", function (ev) {
  if (ev.key !== "Escape") return;
  if (S.calOpen) { S.calOpen = false; renderCal(); return; }
  if (S.colsOpen) { S.colsOpen = false; render(); return; }
  closeDrawer();
});
document.addEventListener("click", function (ev) {
  // Клик мимо всплывающих панелей закрывает их
  if (S.calOpen && !ev.target.closest(".pop-anchor")) { S.calOpen = false; renderCal(); }
  if (S.colsOpen && !ev.target.closest(".cols-anchor")) { S.colsOpen = false; render(); }
});
$("view").addEventListener("click", function (ev) {
  if (ev.target.closest(".resizer")) return;
  var t = ev.target.closest("[data-tab],[data-sort],[data-set],[data-open],[data-action],tr[data-i]");
  if (!t) return;
  if (t.hasAttribute("data-tab")) { S.tab = t.getAttribute("data-tab"); render(); }
  else if (t.hasAttribute("data-sort")) { var k = t.getAttribute("data-sort"); S.desc = S.sort === k ? !S.desc : k !== "date"; S.sort = k; render(); }
  else if (t.hasAttribute("data-set")) { S[t.getAttribute("data-set")] = t.getAttribute("data-val"); render(); }
  else if (t.getAttribute("data-action") === "cols") { ev.stopPropagation(); S.colsOpen = !S.colsOpen; S.colsAnim = S.colsOpen; render(); }
  else if (t.getAttribute("data-action") === "reset-cols") { S.hidden = defaultHidden(); S.widths = {}; savePrefs(); render(); }
  else if (t.getAttribute("data-action") === "add") openEditor(null);
  else if (t.hasAttribute("data-open")) openDrawer(+t.getAttribute("data-open"));
  else if (t.hasAttribute("data-i")) openDrawer(+t.getAttribute("data-i"));
});
$("view").addEventListener("change", function (ev) {
  var f = ev.target.getAttribute("data-filter"), v = ev.target.getAttribute("data-colvis");
  if (f) { S[f] = ev.target.value; render(); }
  if (v) {
    if (ev.target.checked) S.hidden = S.hidden.filter(function (x) { return x !== v; });
    else if (S.hidden.indexOf(v) < 0) S.hidden.push(v);
    savePrefs(); render();
  }
});
var VIEWS = ["overview", "niches", "events", "sales", "dynamics", "venues", "archive", "settings"];
if (VIEWS.indexOf(location.hash.slice(1)) >= 0) S.view = location.hash.slice(1);
// Кнопки «назад/вперёд» браузера переключают разделы
S.enter = true;  // первый показ страницы тоже с анимацией
var fitTimer = null;
window.addEventListener("resize", function () { if (S.view !== "events") return; clearTimeout(fitTimer); fitTimer = setTimeout(render, 150); });
window.addEventListener("hashchange", function () {
  var v = location.hash.slice(1);
  if (VIEWS.indexOf(v) >= 0 && v !== S.view) { S.view = v; S.enter = true; closeDrawer(); render(); }
});
render();
</script>
</body>
</html>
