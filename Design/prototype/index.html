  ddClose(false); enhanceSelects(document.querySelector(".top")); enhanceSelects($("view")); vdRestore();
  candApply();  // «Города, где его нет» — счётчик найденного после перерисовки
  var mt = document.querySelector('.mtabs [aria-selected="true"]');  // на телефоне полоса вкладок «Рынка» прокручивается к выбранной
  if (mt) { var mp = mt.parentNode; mp.scrollLeft += mt.getBoundingClientRect().left - mp.getBoundingClientRect().left - 16; }
  renderCal();
  tableFit();
}
// Шапка таблицы прилипает ровно под верхней панелью (её высота меняется: строка поиска, перенос на узком экране);
// таблица шире карточки — прокрутка внутри карточки (.ev-wide)
function tableFit() {
  var top = document.querySelector(".top");
  if (top) document.documentElement.style.setProperty("--top-h", Math.round(top.getBoundingClientRect().height) + "px");
  document.querySelectorAll(".ev-card-table").forEach(function (c) {
    c.classList.remove("ev-wide");
    var t = c.querySelector("table");
    if (t && t.scrollWidth > c.clientWidth + 1) c.classList.add("ev-wide");
  });
}
window.addEventListener("resize", tableFit);

buildCitySelect();
// Клик по значку или стрелке «пилюли» города — как по самому списку
document.querySelector(".pill-city").addEventListener("click", function (ev) {
  if (ev.target.closest(".dd-btn")) return;
  var b = this.querySelector(".dd-btn"); if (b) b.click();
});
$("city").addEventListener("change", function () { S.m.city = S.city = this.value; S.m.venue = ""; S.m.limit = 200; S.m.day = null; closeDrawer(); render(); });
$("period").addEventListener("click", function (ev) { var b = ev.target.closest("button"); if (b) { S.period = b.getAttribute("data-p"); S.from = S.to = null; render(); } });
$("dateBtn").addEventListener("click", function (ev) { ev.stopPropagation(); if (S.calOpen) { S.calOpen = false; renderCal(); } else openCal(); });
$("q").addEventListener("input", function () { S.q = this.value; if (["events", "archive"].indexOf(S.view) < 0 && !isM()) S.view = "events"; render(); });
function repReset() { S.m.project = S.m.vproj = null; S.m.myEdit = false; S.m.limit = 200; S.colsOpen = false; }
document.querySelectorAll("[data-view]").forEach(function (b) { b.addEventListener("click", function () { if (S.view !== b.getAttribute("data-view")) S.enter = true; S.view = b.getAttribute("data-view"); if (REP_SUB[S.view]) { repReset(); S.repOpen = true; } location.hash = S.view; render(); window.scrollTo(0, 0); }); });
$("repBtn").addEventListener("click", function () { S.repOpen = !S.repOpen; repMenu(); });
function repMenu() {
  var open = !!S.repOpen, inside = !!REP_SUB[S.view] || S.view === "suggest";
  $("repSub").hidden = !open; $("repBtn").setAttribute("aria-expanded", String(open)); $("repBtn").classList.toggle("in", inside && !open);
}
$("veil").addEventListener("click", closeDrawer);
$("view").addEventListener("click", function (ev) {
  var r = ev.target.closest("[data-rep-go]");
  if (r) { S.view = r.getAttribute("data-rep-go"); repReset(); S.enter = true; location.hash = S.view; render(); window.scrollTo(0, 0); return; }
  var t = ev.target.closest("[data-sub]"); if (!t || !SUBS[S.view]) return;
  S.sub[S.view] = t.getAttribute("data-sub"); S.enter = true; closeDrawer(); render(); window.scrollTo(0, 0);
});
document.addEventListener("keydown", function (ev) {
  if (ev.key !== "Escape" || $("confirmDlg").open) return;
  if (S.calOpen) { S.calOpen = false; renderCal(); return; }
  if (S.colsOpen) { S.colsOpen = false; render(); return; }
  closeDrawer();
});
document.addEventListener("click", function (ev) {
  // Клик мимо всплывающих панелей закрывает их
  if (S.calOpen && !ev.target.closest(".pop-anchor")) { S.calOpen = false; renderCal(); }
  if (S.colsOpen && !ev.target.closest(".cols-anchor")) { S.colsOpen = false; render(); }
});
$("view").addEventListener("click", function (ev) {
  if (ev.target.closest(".resizer")) return;
  var t = ev.target.closest("[data-tab],[data-sort],[data-set],[data-open],[data-action],tr[data-i]");
  if (!t) return;
  if (t.hasAttribute("data-tab")) { S.tab = t.getAttribute("data-tab"); render(); }
  else if (t.hasAttribute("data-sort")) { var k = t.getAttribute("data-sort"); S.desc = S.sort === k ? !S.desc : k !== "date"; S.sort = k; render(); }
  else if (t.hasAttribute("data-set")) { S[t.getAttribute("data-set")] = t.getAttribute("data-val"); render(); }
  else if (t.getAttribute("data-action") === "cols") { ev.stopPropagation(); S.colsOpen = !S.colsOpen; S.colsAnim = S.colsOpen; render(); }
  else if (t.getAttribute("data-action") === "reset-cols") { S.hidden = defaultHidden(); S.widths = {}; savePrefs(); render(); }
  else if (t.getAttribute("data-action") === "add") openEditor(null);
  else if (t.hasAttribute("data-open")) openDrawer(+t.getAttribute("data-open"));
  else if (t.hasAttribute("data-i")) openDrawer(+t.getAttribute("data-i"));
});
$("view").addEventListener("change", function (ev) {
  var f = ev.target.getAttribute("data-filter"), v = ev.target.getAttribute("data-colvis");
  if (f) { S[f] = ev.target.value; render(); }
  if (v) {
    if (ev.target.checked) S.hidden = S.hidden.filter(function (x) { return x !== v; });
    else if (S.hidden.indexOf(v) < 0) S.hidden.push(v);
    savePrefs(); render();
  }
});
var VIEWS = ["overview", "city", "niches", "calendar", "new", "events", "projects", "touring", "favorites", "venues", "operators", "suggest", "archive", "sales", "dynamics", "settings", "market"];
if (VIEWS.indexOf(location.hash.slice(1)) >= 0) S.view = location.hash.slice(1);
// Кнопки «назад/вперёд» браузера переключают разделы
S.enter = true;  // первый показ страницы тоже с анимацией
var fitTimer = null;
window.addEventListener("resize", function () { if (S.view !== "events" && !isM()) return; clearTimeout(fitTimer); fitTimer = setTimeout(render, 150); });
curLoad();  // разметка рынка: из приложения (или из браузера, если прототип открыт файлом)
myLoad();  // избранные проекты и записи о них — из приложения (открытый файлом — из браузера)
settingsLoad(); ghRunsLoad();  // настройки этого компьютера и ход сборов на GitHub — только через приложение
window.addEventListener("hashchange", function () {
  var v = location.hash.slice(1);
  if (VIEWS.indexOf(v) >= 0 && v !== S.view) { S.view = v; if (REP_SUB[v]) repReset(); S.enter = true; closeDrawer(); render(); }
});
render();
</script>
</body>
