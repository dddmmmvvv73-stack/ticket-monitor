# Сбор афиш конкурентов по расписанию — вместо app.py на ноутбуке.
# Код — ветка main, собранные данные (data/competitors) — ветка data этого же репозитория.
# Ключ GigaChat — секрет GIGACHAT_AUTH_KEY (Settings → Secrets and variables → Actions).
name: Сбор конкурентов

# Раз в час, в :25 МСК, сбор запускает cron-job.org (POST …/actions/workflows/collect.yml/dispatches,
# fine-grained токен только с Actions: write на этот репозиторий). Своё расписание GitHub срабатывало
# редко — 30.09 из ежечасных окон сработало одно, — поэтому schedule убран.
on:
  workflow_dispatch:           # cron-job.org и вручную: gh workflow run collect.yml

concurrency:
  group: collect               # два сбора одновременно не идут
  cancel-in-progress: false

permissions:
  contents: write              # чтобы сохранить данные в ветку data

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Europe/Moscow        # время в журнале и истории — московское, как у сборов с ноутбука
    steps:
      - name: Код
        uses: actions/checkout@v4

      - name: Данные прошлых сборов (ветка data)
        uses: actions/checkout@v4
        with:
          ref: data
          path: data/competitors

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ai.txt

      - name: Пакеты
        run: pip install "gigachat==0.2.3"

      - name: Настройки (ключ — из секрета, в журнал не попадает)
        env:
          GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
        run: |
          python - <<'PY'
          import json, os
          key = os.environ.get("GIGACHAT_AUTH_KEY", "")
          settings = {"competitors": {
              "auto_enabled": False, "ai_provider": "gigachat" if key else "off",
              "gigachat_auth_key": key, "gigachat_scope": "GIGACHAT_API_PERS", "gigachat_model": "GigaChat-2-Max",
              "sheets_auto_export": False}}
          with open("config/settings.json", "w", encoding="utf-8") as f:
              json.dump(settings, f, ensure_ascii=False)
          print("нейросеть:", settings["competitors"]["ai_provider"])
          PY

      - name: Сбор
        run: python -m competitors.collector auto

      - name: Сохранить данные в ветку data
        if: always()
        working-directory: data/competitors
        run: |
          git config user.name "ticket-monitor bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Изменений нет"; exit 0; fi
          git commit -q -m "Сбор $(date '+%Y-%m-%d %H:%M')"
          git push -q origin HEAD:data
