# «Афиша рынка»: 98 городов по Кассиру и Яндекс Афише — раз в сутки.
# Запускает cron-job.org в 21:00 МСК (POST …/actions/workflows/market.yml/dispatches, тот же токен, что у сбора конкурентов).
# Код — ветка main, данные — ветка data (data/competitors/market). Ключ GigaChat — секрет GIGACHAT_AUTH_KEY.
name: Афиша рынка

on:
  workflow_dispatch:           # cron-job.org и вручную: gh workflow run market.yml

concurrency:
  group: data-branch           # общая очередь со сбором конкурентов: оба пишут в ветку data и в кэш нейросети
  cancel-in-progress: false

permissions:
  contents: write              # чтобы сохранить данные в ветку data

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # сбор ~25 мин + до 30 мин страниц организаторов (первые вечера)
    env:
      TZ: Europe/Moscow        # «сегодня» и время в журнале — московские
    steps:
      - name: Код
        uses: actions/checkout@v4

      - name: Данные прошлых сборов (ветка data)
        uses: actions/checkout@v4
        with:
          ref: data
          path: data/competitors

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ai.txt

      - name: Пакеты
        run: pip install "gigachat==0.2.3"

      - name: Настройки (ключ — из секрета, в журнал не попадает)
        env:
          GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
        run: |
          python - <<'PY'
          import json, os
          key = os.environ.get("GIGACHAT_AUTH_KEY", "")
          settings = {"competitors": {
              "ai_provider": "gigachat" if key else "off",
              "gigachat_auth_key": key, "gigachat_scope": "GIGACHAT_API_PERS", "gigachat_model": "GigaChat-2-Max"}}
          with open("config/settings.json", "w", encoding="utf-8") as f:
              json.dump(settings, f, ensure_ascii=False)
          print("нейросеть:", settings["competitors"]["ai_provider"])
          PY

      - name: Сбор
        run: python -m competitors.market

      - name: Сохранить данные в ветку data
        if: always()
        working-directory: data/competitors
        run: |
          git config user.name "ticket-monitor bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Изменений нет"; exit 0; fi
          git commit -q -m "Рынок $(date '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            git push -q origin HEAD:data && exit 0
            git pull -q --rebase origin data || { git rebase --abort; exit 1; }
          done
          exit 1
